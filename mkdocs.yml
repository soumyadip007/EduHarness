      - Contract Spec: contract_spec.md
      - Learner State Spec: learner_state_spec.md
      - Escalation Protocol: escalation_protocol.md
      - Trace Spec: trace_spec.md
      - Simulated Learner Spec: simulated_learner_spec.md
  - Pilot:
      - IRB Draft: pilot/irb_ethics_application_draft.md
      - Pre/Post Test: pilot/pre_post_test_python_module.md
      - Student Feedback: pilot/student_feedback_questionnaire.md
      - Teacher Workload: pilot/teacher_workload_survey.md
      - Execution Protocol: pilot/pilot_execution_protocol.md
