[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eduharness"
version = "0.1.0"
description = "EduHarness: pedagogical harness for trustworthy agentic tutoring"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Souchowd" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "tenacity>=8.5.0"
]

[tool.setuptools.packages.find]
include = ["eduharness*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
